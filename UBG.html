games.forEach(game=>{const card=document.createElement('button');card.className='card';card.type='button';card.setAttribute('aria-label','Launch '+game.name);const image=document.createElement('img');image.src=game.image;image.alt='';image.loading='lazy';image.onerror=()=>{image.onerror=null;image.src='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"%3E%3Crect width="320" height="180" fill="%23201b29"/%3E%3Ctext x="50%25" y="55%25" fill="white" text-anchor="middle" font-size="20" font-family="sans-serif"%3EGame%3C/text%3E%3C/svg%3E'};const label=document.createElement('span');label.textContent=game.name;card.append(image,label);card.addEventListener('click',()=>{selected=game;document.getElementById('title').textContent=game.name;dialog.classList.add('open')});grid.append(card)});
function prepare(html,url){const base='<base href="'+new URL('.',url).href+'">';return /<head\b[^>]*>/i.test(html)?html.replace(/<head\b[^>]*>/i,head=>head+base):'<!doctype html><head>'+base+'</head>'+html}
async function launch(mode){if(!selected)return;const game=selected;dialog.classList.remove('open');const tab=window.open('about:blank','_blank');if(!tab){showStatus('Popup blocked. Allow popups, then try again.');return}tab.document.open();tab.document.write('<!doctype html><title>Loading game…</title><body style="margin:0;padding:24px;background:#08080b;color:white;font:16px system-ui">Fetching '+game.name.replace(/[&<>]/g,'')+'…</body>');tab.document.close();let lastError=null;for(const url of game.sources){try{const response=await fetch(url);if(!response.ok)throw new Error('HTTP '+response.status);const html=await response.text();if(!html.trim())throw new Error('Empty game source');const prepared=prepare(html,url);if(mode==='blob'){const blobUrl=URL.createObjectURL(new Blob([prepared],{type:'text/html'}));tab.location.replace(blobUrl);setTimeout(()=>URL.revokeObjectURL(blobUrl),60000)}else{tab.document.open();tab.document.write(prepared);tab.document.close()}return}catch(error){lastError=error}}tab.document.body.textContent='Could not fetch this game source: '+(lastError?.message||'network error')+'. Try another game or source.'}
document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>launch(button.dataset.mode)));document.getElementById('cancel').addEventListener('click',()=>dialog.classList.remove('open'));dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.classList.remove('open')});document.addEventListener('keydown',event=>{if(event.key==='Escape')dialog.classList.remove('open')});
</script></body></html>
